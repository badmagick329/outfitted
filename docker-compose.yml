services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: outfitted
      POSTGRES_USER: outfitted
      POSTGRES_PASSWORD: outfitted
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfitted -d outfitted"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
